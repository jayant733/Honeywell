name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install quality tools
        run: python -m pip install pytest ruff mypy
      - name: Lint
        run: python -m ruff check .
      - name: Type check
        run: python -m mypy packages apps
      - name: Test
        run: python -m pytest
